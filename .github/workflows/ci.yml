name: NovaDB CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile package and tests
        run: python -m compileall -q novadb tests
      - name: Run dependency-free regression suite
        env:
          PYTHONPATH: .
        run: python -m tests.test_runner
